services:
  - type: web
    name: mysivi-growth-lab-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-flash-latest
      - key: GEMINI_IMAGE_MODEL
        value: imagen-3.0-generate-002
      - key: ALLOWED_ORIGINS
        value: '["https://mysivi-growth-lab.vercel.app","http://localhost:3000","http://127.0.0.1:3000"]'
      - key: MAX_RUN_LLM_CALLS
        value: "15"
      - key: QUALITY_THRESHOLD
        value: "7.0"
      - key: MAX_REVISIONS
        value: "1"
      - key: MAX_CONCURRENT_RUNS
        value: "2"
      - key: THREAD_TTL_SECONDS
        value: "3600"
